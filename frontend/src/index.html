<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图书管理系统</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="boot" class="boot">
      <div class="boot-spinner"></div>
      <p>正在启动图书管理系统…</p>
    </div>

    <div id="login-root" class="login-root hidden"></div>

    <div id="app-root" class="app-root hidden">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-logo">图</div>
          <div class="brand-text">
            <div class="brand-title">图书管理系统</div>
            <div class="brand-sub">Library Management</div>
          </div>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="sidebar-footer">
          <div id="user-chip" class="user-chip"></div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <h1 id="page-title" class="page-title"></h1>
          <div class="topbar-actions">
            <button id="btn-password" class="btn btn-ghost" type="button">修改口令</button>
            <button id="btn-logout" class="btn btn-ghost" type="button">退出登录</button>
          </div>
        </header>
        <section id="view" class="view"></section>
      </main>
    </div>

    <nav id="mobile-nav" class="mobile-nav" aria-label="移动端导航"></nav>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>

    <script>
      // 诊断：把模块加载错误 / 未处理 Promise 拒绝显示到页面顶部。
      (function () {
        function show(label, text) {
          var d = document.createElement("div");
          d.style.cssText =
            "position:fixed;top:0;left:0;right:0;background:#b00020;color:#fff;padding:8px;font:13px monospace;z-index:99999;white-space:pre-wrap;";
          d.textContent = label + ": " + text;
          document.body.appendChild(d);
        }
        window.addEventListener("error", function (e) {
          show("ERROR", (e.message || e.error) + " @ " + (e.filename || "") + ":" + e.lineno);
        });
        window.addEventListener("unhandledrejection", function (e) {
          show("REJECT", (e.reason && e.reason.message) || e.reason);
        });
      })();
    </script>
    <script src="./vendor/http.global.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
